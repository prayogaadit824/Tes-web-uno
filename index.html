<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Web Chat</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    :root {
      --bg: #0b0e14;
      --card: #151a21;
      --accent: #00f3ff;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --my-msg: #0284c7;
      --friend-msg: #1e293b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; }

    .container { width: 100%; max-width: 480px; height: 100vh; background: var(--card); display: flex; flex-direction: column; position: relative; box-shadow: 0 0 20px rgba(0,243,255,0.1); }
    
    .auth-screen { padding: 2rem; display: flex; flex-direction: column; justify-content: center; height: 100%; gap: 1rem; text-align: center; }
    .auth-screen h2 { color: var(--accent); margin-bottom: 0.5rem; }
    .input-box { width: 100%; padding: 0.8rem; background: #222936; border: 1px solid rgba(0,243,255,0.2); border-radius: 8px; color: #fff; outline: none; }
    .btn { padding: 0.8rem; background: var(--accent); border: none; border-radius: 8px; color: #000; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn:hover { opacity: 0.9; }

    .chat-header { padding: 1rem; background: #0f131a; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }
    .user-info span { font-size: 0.8rem; color: var(--accent); }

    .target-bar { padding: 0.6rem 1rem; background: #1a212d; display: flex; gap: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .target-bar input { flex: 1; padding: 0.4rem 0.8rem; background: #111620; border: 1px solid #2d3748; border-radius: 6px; color: #fff; font-size: 0.85rem; outline: none; }

    .chat-box { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.8rem; }
    .msg { max-width: 80%; padding: 0.6rem 0.9rem; border-radius: 12px; font-size: 0.9rem; word-break: break-word; }
    .msg.me { align-self: flex-end; background: var(--my-msg); color: #fff; border-bottom-right-radius: 2px; }
    .msg.friend { align-self: flex-start; background: var(--friend-msg); border: 1px solid #334155; border-bottom-left-radius: 2px; }
    .msg img, .msg video { max-width: 100%; border-radius: 8px; margin-top: 0.4rem; display: block; }
    .msg a { color: var(--accent); text-decoration: underline; }

    .input-bar { padding: 0.8rem; background: #0f131a; display: flex; align-items: center; gap: 0.5rem; }
    .file-label { cursor: pointer; color: var(--text-muted); padding: 0.5rem; font-size: 1.2rem; }
    .file-label:hover { color: var(--accent); }
    
    .sticker-picker { display: none; position: absolute; bottom: 65px; left: 10px; background: #111620; border: 1px solid #2d3748; border-radius: 8px; padding: 0.5rem; gap: 0.8rem; z-index: 10; }
    .sticker-picker span { font-size: 1.5rem; cursor: pointer; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  
  <!-- Screen 1: Register -->
  <div id="authScreen" class="auth-screen">
    <h2>⚡ Quick WebChat</h2>
    <p style="color: var(--text-muted); font-size: 0.85rem;">Daftar nama & username buat langsung chat temen!</p>
    <input type="text" id="regName" class="input-box" placeholder="Nama Kamu" />
    <input type="text" id="regUsername" class="input-box" placeholder="Buat Username (Contoh: dimas)" />
    <button class="btn" onclick="registerUser()">Mulai Chatting</button>
  </div>

  <!-- Screen 2: Chat App -->
  <div id="chatScreen" class="chat-screen hidden" style="height: 100%; display: flex; flex-direction: column;">
    <div class="chat-header">
      <div class="user-info">
        <h4 id="displayMyName">Nama</h4>
        <span id="displayMyUsername">@username</span>
      </div>
      <button onclick="logout()" style="background:none; border:none; color:#ef4444; cursor:pointer;"><i class="fas fa-sign-out-alt"></i></button>
    </div>

    <div class="target-bar">
      <input type="text" id="targetUsername" placeholder="Ketik username temen kamu..." />
      <button class="btn" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;" onclick="connectChat()">Hubungkan</button>
    </div>

    <div class="chat-box" id="chatBox">
      <div id="statusInfo" style="text-align: center; color: var(--text-muted); font-size: 0.8rem; margin-top: 2rem;">
        Ketik username teman kamu di atas lalu klik <b>Hubungkan</b>.
      </div>
    </div>

    <div id="stickerPicker" class="sticker-picker">
      <span onclick="sendSticker('🔥')">🔥</span>
      <span onclick="sendSticker('😎')">😎</span>
      <span onclick="sendSticker('👍')">👍</span>
      <span onclick="sendSticker('😂')">😂</span>
      <span onclick="sendSticker('❤️')">❤️</span>
    </div>

    <div class="input-bar">
      <span class="file-label" onclick="toggleStickers()"><i class="far fa-smile"></i></span>
      
      <label class="file-label">
        <i class="fas fa-paperclip"></i>
        <input type="file" id="fileInput" class="hidden" onchange="sendFile(this)" />
      </label>

      <input type="text" id="messageInput" class="input-box" placeholder="Ketik pesan..." style="flex:1;" onkeydown="if(event.key==='Enter') sendMessage()" />
      <button class="btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>

</div>

<script>
  // Database Public Realtime (Langsung Terhubung & Tanpa Autentikasi)
  const firebaseConfig = {
    databaseURL: "https://gigs-chat-default-rtdb.asia-southeast1.firebasedatabase.app"
  };
  
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.database();

  let currentUser = JSON.parse(localStorage.getItem('webchat_user')) || null;
  let activeRoomId = null;
  let chatListener = null;

  window.onload = () => {
    if (currentUser) {
      showChatScreen();
    }
  };

  function registerUser() {
    const name = document.getElementById('regName').value.trim();
    const username = document.getElementById('regUsername').value.trim().toLowerCase().replace(/\s+/g, '');

    if (!name || !username) return alert('Isi Nama dan Username dulu!');

    currentUser = { name, username };
    localStorage.setItem('webchat_user', JSON.stringify(currentUser));
    showChatScreen();
  }

  function showChatScreen() {
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('chatScreen').classList.remove('hidden');
    document.getElementById('displayMyName').innerText = currentUser.name;
    document.getElementById('displayMyUsername').innerText = '@' + currentUser.username;
  }

  function logout() {
    localStorage.removeItem('webchat_user');
    location.reload();
  }

  function connectChat() {
    const target = document.getElementById('targetUsername').value.trim().toLowerCase().replace(/\s+/g, '');
    if (!target) return alert('Masukkan username teman!');
    if (target === currentUser.username) return alert('Gak bisa chat ke diri sendiri!');

    // Buat Room ID Unik
    const sorted = [currentUser.username, target].sort();
    activeRoomId = `room_${sorted[0]}_${sorted[1]}`;

    const chatBox = document.getElementById('chatBox');
    chatBox.innerHTML = '<div style="text-align:center; color:#00f3ff; font-size:0.8rem;">Menghubungkan ruang chat...</div>';

    // Matikan listener lama jika ada
    if (chatListener) {
      db.ref('chats/' + activeRoomId).off('child_added', chatListener);
    }

    chatBox.innerHTML = '';

    // Dengarkan Pesan Realtime
    chatListener = db.ref('chats/' + activeRoomId).on('child_added', (snapshot) => {
      const data = snapshot.val();
      renderMessage(data);
    });
  }

  function renderMessage(data) {
    const chatBox = document.getElementById('chatBox');
    const isMe = data.sender === currentUser.username;
    
    const msgDiv = document.createElement('div');
    msgDiv.className = `msg ${isMe ? 'me' : 'friend'}`;

    let content = `<small style="opacity:0.7; font-size:0.7rem;">${isMe ? 'Kamu' : '@' + data.sender}</small><br>`;

    if (data.type === 'text') {
      content += data.body;
    } else if (data.type === 'sticker') {
      content += `<span style="font-size:2.2rem">${data.body}</span>`;
    } else if (data.type === 'image') {
      content += `<img src="${data.body}" />`;
    } else if (data.type === 'video') {
      content += `<video src="${data.body}" controls></video>`;
    } else if (data.type === 'file') {
      content += `<a href="${data.body}" download="file_${Date.now()}">📁 Download File</a>`;
    }

    msgDiv.innerHTML = content;
    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();

    if (!activeRoomId) return alert('Klik tombol "Hubungkan" ke username temen kamu dulu!');
    if (!text) return;

    db.ref('chats/' + activeRoomId).push({
      sender: currentUser.username,
      type: 'text',
      body: text,
      timestamp: Date.now()
    });

    input.value = '';
  }

  function sendSticker(emoji) {
    if (!activeRoomId) return alert('Klik tombol "Hubungkan" ke username temen kamu dulu!');
    db.ref('chats/' + activeRoomId).push({
      sender: currentUser.username,
      type: 'sticker',
      body: emoji,
      timestamp: Date.now()
    });
    toggleStickers();
  }

  function toggleStickers() {
    const picker = document.getElementById('stickerPicker');
    picker.style.display = picker.style.display === 'flex' ? 'none' : 'flex';
  }

  function sendFile(input) {
    if (!activeRoomId) return alert('Klik tombol "Hubungkan" ke username temen kamu dulu!');
    const file = input.files[0];
    if (!file) return;

    if (file.size > 2 * 1024 * 1024) {
      return alert('Ukuran file maksimal 2MB agar terkirim cepat!');
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      const base64Data = e.target.result;
      let fileType = 'file';

      if (file.type.startsWith('image/')) fileType = 'image';
      else if (file.type.startsWith('video/')) fileType = 'video';

      db.ref('chats/' + activeRoomId).push({
        sender: currentUser.username,
        type: fileType,
        body: base64Data,
        timestamp: Date.now()
      });
    };
    reader.readAsDataURL(file);
  }
</script>

</body>
</html>
